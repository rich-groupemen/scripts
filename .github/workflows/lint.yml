# CI mirrors the local pre-push gate: same mise pins, same make targets.
name: lint

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise and pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Show tool versions
        run: |
          shellcheck --version
          shfmt --version
          pwsh --version

      - name: Lint
        run: make lint

      - name: Test
        run: make test
